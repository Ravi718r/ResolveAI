[project]
name = "resolveai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ravi718r", email = "mynameraviyadav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.3",
    "langchain-aws>=1.8.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]



[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
